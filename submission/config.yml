cryptoface:
  # Model checkpoint is hosted on Hugging Face and downloaded (and cached) on
  # first use. To run fully offline, place the file at ckpt_path (below) and it
  # will be used instead of the download.
  ckpt_hf_repo:   "halmsu/cryptoface-v1"
  ckpt_hf_file:   "backbone-64x64.ckpt"
  ckpt_path:      "submission/checkpoints/backbone-64x64.ckpt"
  orion_config:   "submission/orion_configs/cryptoface_net4.yml"
  circuit_manifest: "submission/circuit_manifest.json"
  orion_commit: "7e27281354f9ac5ffd0cf4330fee2bbea75a9dc7"
  dataset_hf_repo: "halmsu/celeba-1024-pairs"
  input_size:     64
  # L2NormPoly coefficients: a*y^2 + b*y + c ≈ 1/sqrt(y), where y = sum-of-squares of the embedding.
  # Fitted on CelebA face_dataset.npy (SOS range [108, 505], mean=267, std=76).
  l2_poly_coeffs: [3.497142e-07, -3.070292e-04, 1.182291e-01]
  # Five concurrent pair slots maximize throughput on an otherwise idle 1 TB
  # machine. Four slots is the safer option when more memory headroom is needed.
  pair_slots: 5
  # Refresh the aggregation process regularly to release retained Go/FHE memory.
  aggregator_max_pairs: 10
  pair_timeout_s: 3600
